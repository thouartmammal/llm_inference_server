syntax = "proto3";

option go_package = "github.com/thouartmammal/llm_inference_server/gateway";

enum Phase {
  PHASE_UNSPECIFIED = 0;
  PREFILL = 1;
  DECODE = 2;
}

message ScheduleTaskRequest {
  string request_id = 1;
  Phase phase = 2;
  repeated int32 block_table = 3;
  repeated int32 token_ids = 4;
}

message ScheduleTaskBatch {
  repeated ScheduleTaskRequest requests = 1;
}

message SampledToken {
  string request_id = 1;
  int32 token_id = 2;
  bool finished = 3;
}

message ScheduleTaskResponse {
  repeated SampledToken sampled_tokens = 1;
}

message CancelGenerationRequest {
  string request_id = 1;
}

message CancelGenerationResponse {
  bool cache_released = 1;
}

service SchedulerWorker {
  rpc ScheduleTask(ScheduleTaskBatch) returns (ScheduleTaskResponse);
  rpc CancelGeneration(CancelGenerationRequest) returns (CancelGenerationResponse);
}