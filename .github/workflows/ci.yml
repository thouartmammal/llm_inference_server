# Runs on every push and pull request.

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install code generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          python -m pip install -r requirements.txt

      - name: Validate Compose
        run: docker compose config

      - name: Compile the proto
        run: |
          mkdir -p gateway worker
          protoc -I. scheduler-worker.proto \
            --go_out=./gateway --go_opt=paths=source_relative \
            --go-grpc_out=./gateway --go-grpc_opt=paths=source_relative
          python -m grpc_tools.protoc -I. \
            --python_out=./worker \
            --grpc_python_out=./worker \
            scheduler-worker.proto
